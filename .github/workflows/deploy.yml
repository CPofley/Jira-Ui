name: Deploy to EC2
on: 
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.204.130.37.nip.io
          username: ec2-user
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            # Pull latest changes and build
            cd /home/ec2-user/node-app
            git pull origin main
            npm install
            npm run build
            pm2 restart jira-ui
