name: Deploy to EC2

on: 
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.200.43.90
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest changes and build
            cd /home/ec2-user/node-app
            git pull origin main
            npm install
            npm run build
            
            # Clear old PM2 process to free up memory and start fresh
            pm2 delete jira-ui || true
            pm2 start npx --name "jira-ui" -- serve -s dist -l 3000
            pm2 save
